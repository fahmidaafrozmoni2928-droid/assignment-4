<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#F8FAFC]">
    <header class="w-[80%] mx-auto">
        <h1 class="text-2xl font-bold">Job Application Tracker</h1>
        <div class="grid grid-cols-3 gap-5 pt-3">
            <div class="bg-white rounded pl-4 py-3">
                <p class="">Total</p>
                <p id="total-count" class="">0</p>
            </div>

            <div class="bg-white rounded pl-4 py-3">
                <p class="">Interview</p>
                <p id="interview-count" class="text-green-500">0</p>
            </div>

            <div class="bg-white rounded pl-4 py-3">
                <p class="">Rejected</p>
                <p id="rejected-count" class="text-red-500">0</p>
            </div>
        </div>
        
    </header>
    <br> 
    <hr class="w-[80%] mx-auto border-gray-200 ">

    <main class="w-[80%] mx-auto pt-3">
        <div class="flex justify-between ">
        <h1 class="font-bold">Available Jobs</h1>
        <div class="flex">
            <p class="text-gray-600">0</p>
            <p class="text-gray-600">jobs</p>
        </div>
    </div>
    </main>

    <section class="w-[80%] mx-auto">
        <button>All</button>
        <button>Interview</button>
        <button>Rejected</button>
    </section>
</body>
</html>
